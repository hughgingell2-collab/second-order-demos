# OpportunityScout catalog — single source of truth.
# Researched August 2026. Dates flagged "expected" are pattern-based projections
# from the last published cycle; the scraper watches each url and flags when the
# real dates appear. Format per entry:
#   id (stable), name, category, sub (small tag), blurb (<=2 sentences),
#   prepare (1 sentence), deadline (ISO or null), deadlineNote, cadence,
#   url (page where dates are published — this is what gets scraped),
#   watch: false to list without scraping.
# Applied / not-interested record lives in scout/status.yaml.

profile:
  summary: >
    Australian lawyer (Sydney; energy & infrastructure M&A background) pivoting
    into AI — building TerraCheck (AI due diligence for property/infrastructure)
    toward an AI-native law firm for infrastructure M&A. Study targets: Stanford,
    Harvard, Penn/Wharton, Oxford, Cambridge.

categories:
  - key: study
    label: Further study opportunities
    tab: Study
    intro: >
      Masters programs for the AI pivot at Stanford, Harvard, Penn/Wharton,
      Oxford and Cambridge — the realistic shortlist for a lawyer without a CS
      undergrad, across AI/CS, law + technology, and MBA routes.
  - key: startup
    label: Startup programs & funding
    tab: Startups
    intro: >
      Incubators, accelerators, founder fellowships and grants for TerraCheck —
      Australia and the USA in focus. Antler is already marked applied from your
      record.
  - key: pitch-syd
    label: Pitch events — Sydney
    tab: Pitch · SYD
    intro: >
      Recurring Sydney stages to pitch or demo TerraCheck in front of investors —
      from monthly low-stakes reps to the year's flagship showcases.
  - key: pitch-sf
    label: Pitch events — San Francisco
    tab: Pitch · SF
    intro: >
      Bay Area pitch competitions, demo nights and conferences worth planning a
      trip around — AI-native crowds and the two legal-tech-relevant stages.
  - key: other
    label: Other opportunities
    tab: Other
    intro: >
      Scholarships, fellowships and money that fund the pivot itself — full-ride
      study funding, AI-policy fellowships, and Australian tax/grant levers.

opportunities:
  # ================= 1. FURTHER STUDY =================
  - id: penn-mas-cs-online
    name: Penn MAS in Computer Science Online
    category: study
    sub: AI/CS masters
    blurb: >
      The renamed MCIT Online — an Ivy League CS masters explicitly designed for
      people with no CS background, now with an AI concentration. Online and
      part-time friendly, so you can build TerraCheck while studying (~US$40k total).
    prepare: Transcripts, resume, personal statement and references — no CS degree or GRE required.
    deadline: "2026-10-19"
    deadlineNote: Regular deadline for the next cohort; scholarship round closed 3 Aug 2026.
    url: https://online.seas.upenn.edu/degrees/mas-cs-online/

  - id: harvard-alm-ds
    name: Harvard ALM in Data Science & AI (Extension)
    category: study
    sub: AI/CS masters
    blurb: >
      Harvard's "earn your way in" part-time masters — pass 2–3 qualifying courses
      with B+ and you're admitted, no application gamble. ~US$41k total and mostly
      online; less prestigious than SEAS but a genuine Harvard credential.
    prepare: Just register for a qualifying course next term (Jan/June/Sept) and show Python/calculus proficiency.
    deadline: null
    cadence: Enrol each term (Jan / June / Sept)
    deadlineNote: No admissions deadline — course registration each term instead.
    url: https://extension.harvard.edu/academics/programs/data-science-graduate-program/

