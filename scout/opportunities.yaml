scholarships:
  # ---------- open now / upcoming this cycle ----------
  - id: openphil-transition
    name: Open Philanthropy / Coefficient Giving — Career Transition Funding
    funds: Graduate study anywhere (incl. Stanford/Oxbridge masters), self-study, career pivots into AI governance/safety
    value: Case-by-case — can cover full tuition + living costs
    eligibility: Any nationality, any career stage — explicitly designed for professionals (e.g. lawyers) pivoting into AI policy. Arguably the best-fit funder for this profile.
    opens: Rolling — open now
    deadline: null
    deadlineNote: Rolling; decisions typically within ~6 weeks. Rebranded Coefficient Giving late 2025 — same program.
    url: https://www.openphilanthropy.org/career-development-and-transition-funding/

  - id: horizon-fellowship
    name: Horizon Fellowship (AI policy placements, Washington DC)
    funds: Not a degree — funded placements (up to 2 yrs) in US agencies/Congress/think tanks on AI policy
    value: Salary support up to ~US$190k + training
    eligibility: Some placements need US work authorisation — check constraints as an Australian. Strong alternative or sequel to a masters.
    opens: Open now
    deadline: "2026-08-30"
    deadlineNote: Confirmed 2027-cohort deadline — closes 30 Aug 2026, 11:59pm AoE.
    url: https://horizonpublicservice.org/programs/become-a-fellow/

  - id: knight-hennessy
    name: Knight-Hennessy Scholars (Stanford)
    funds: Any full-time Stanford graduate degree — MS, MBA/MSx, LLM, PhD
    value: Full — tuition + stipend + travel, up to 3 years
    eligibility: Any nationality BUT bachelor's must be earned Jan 2020 or later for the 2027 cohort (7-year rule) — verify against your graduation year before writing it off.
    opens: "2026-06-01"
    deadline: "2026-10-06"
    deadlineNote: Confirmed — KH application due 6 Oct 2026 1pm PT; the Stanford degree application is also required (by ~1 Dec 2026).
    url: https://knight-hennessy.stanford.edu/admission/before-you-apply/dates-and-deadlines

  - id: gates-cambridge
    name: Gates Cambridge Scholarship
    funds: Any full-time postgraduate degree at Cambridge (LLM, MPhil MLMI, ACS…)
    value: Full — fees + ~£21k stipend + airfares
    eligibility: Non-UK citizens incl. Australians; no age limit. Extremely competitive but a genuine fit.
    opens: September 2026
    deadline: "2026-12-08"
    deadlineNote: Confirmed 2027-28 entry, international round — actual date is your course's Cambridge funding deadline (early Dec 2026 or early Jan 2027).
    url: https://www.gatescambridge.org/apply/timeline/

  - id: cambridge-trust
    name: Cambridge Trust Scholarships (incl. Cambridge International)
    funds: Masters and PhD across Cambridge — partial to full awards
    value: Partial fee awards up to full cost
    eligibility: International students incl. Australians — automatic consideration via the Cambridge course application, no separate form.
    opens: September 2026
    deadline: "2026-12-02"
    deadlineNote: Apply via Cambridge admissions by the course funding deadline (early Dec 2026 / early Jan 2027); exact 2027 dates publish ~Sept 2026.
    url: https://www.cambridgetrust.org/scholarship/cambridge-international-scholarship/

  - id: cambridge-australia
    name: Cambridge Australia Scholarships
    funds: Masters (partial, co-funded with Cambridge Trust) and PhD at Cambridge — Australians only
    value: Masters partial; PhD full cost
    eligibility: Australian citizens/residents — automatic pipeline once you apply to Cambridge by the funding deadline.
    opens: September 2026
    deadline: "2026-12-02"
    deadlineNote: No direct application — apply via Cambridge Graduate Admissions by the course funding deadline.
    url: https://www.cambridgeaustralia.org.au/how-to-apply

  - id: clarendon
    name: Clarendon Fund (Oxford)
    funds: Any Oxford masters or DPhil, all subjects — ~200+ awards/yr
    value: Full — course fees + ~£20k living grant
    eligibility: All nationalities, no age limit, purely academic merit — automatic consideration with your Oxford course application.
    opens: September 2026
    deadline: "2027-01-08"
    deadlineNote: No separate application — submit the Oxford course application by its Dec 2026 / Jan 2027 deadline (BCL is late January).
    url: https://www.ox.ac.uk/clarendon

  - id: rg-menzies-harvard
    name: R.G. Menzies Scholarship to Harvard
    funds: Any Harvard graduate school (HLS LLM, HKS, HBS, SEAS)
    value: Up to US$60k (1-yr degree) / US$120k (2-yr); up to 2/yr
    eligibility: Australian citizens heading to Harvard with intent to contribute to Australia — excellent fit for a lawyer targeting HLS.
    opens: ~Nov–Dec 2026
    deadline: "2027-01-15"
    deadlineNote: Expected mid-January close based on the latest known cycle — check the ANU scholarships page from ~Nov 2026.
    url: https://study.anu.edu.au/scholarships/find-scholarship/rg-menzies-scholarship-harvard

  - id: frank-knox
    name: Frank Knox Memorial Fellowship (Harvard)
    funds: Graduate study at Harvard for citizens of Australia, Canada, NZ, UK
    value: Substantial — tuition + health fees + living stipend ~10 months
    eligibility: Australian citizens applying to Harvard; no tight age limit — very strong fit alongside R.G. Menzies.
    opens: ~Oct–Nov 2026
    deadline: "2027-02-10"
    deadlineNote: Expected (2026-27 round closed 10 Feb 2026); ~early Feb 2027 for AY2027-28.
    url: https://frankknox.harvard.edu/australia

  - id: oxford-australia-fund
    name: Oxford Australia Scholarship Fund (James Fairfax)
    funds: Postgraduate study at Oxford for Australians
    value: Partial top-up (~A$15–40k historically) — stacks with Clarendon shortfall
