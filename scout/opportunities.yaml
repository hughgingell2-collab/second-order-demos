# OpportunityScout catalog — single source of truth.
# Researched August 2026 for the 2026-27 application cycle (mostly 2027 entry).
# Dates marked "expected" in deadlineNote are extrapolated from the last published
# cycle; the scraper watches each url and flags when real dates appear.
#
# Schema:
#   programs:       id, university, program, degree, category (ai-masters|law-tech|mba),
#                   opens, deadline (ISO, drives days-left badge), deadlineNote, tuition,
#                   tuitionSort (rough annual USD for sorting), fit, url, watch (default true)
#   scholarships:   id, name, funds, value, eligibility, opens, deadline, deadlineNote, url
#   startupSupport: id, name, region (AU|US|World), location, offer, equity, cadence,
#                   deadline, deadlineNote, fit, url

profile:
  summary: >
    Australian lawyer pivoting into AI — target areas: artificial intelligence,
    AI applied to law, AI governance. Study targets: Stanford, Harvard,
    Penn/Wharton, Oxford, Cambridge. Startup focus: AI / legal-tech, AU + US.

programs:
  # ---------- AI / CS / data-science masters ----------
  - id: penn-mas-cs-online
    university: University of Pennsylvania (Penn Engineering)
    program: MAS in Computer Science Online (successor to MCIT Online)
    degree: MAS, online, part-time friendly
    category: ai-masters
    opens: Rolling cohorts (Spring/Fall) — open now
    deadline: "2026-10-19"
    deadlineNote: >
      Regular admission deadline for the next cohort. MCIT Online stopped taking
      applications in 2026 and was replaced by MAS-CS Online — same
      designed-for-non-CS curriculum, now with an Artificial Intelligence
      concentration.
    tuition: ~US$37–40k total
    tuitionSort: 20000
    fit: >
      Best-in-class fit — explicitly designed for students with no CS background;
      AI concentration; study online while still practising law.
    url: https://online.seas.upenn.edu/degrees/mas-cs-online/

  - id: harvard-alm-ds
    university: Harvard University (Extension School)
    program: ALM in Data Science and Artificial Intelligence
    degree: ALM, part-time, mostly online
    category: ai-masters
    opens: Register each term (Jan / June / Sept) — no upfront application
    deadline: null
    deadlineNote: >
      "Earn your way in": complete 2–3 qualifying courses with B+ grades, then
      apply for admission. Course registration deadlines each term rather than
      an admissions deadline.
    tuition: ~US$41k total ($3,440/course)
    tuitionSort: 14000
    fit: >
      Excellent career-changer fit — no CS degree required, low-risk entry,
      Harvard brand; less prestigious than the SEAS SM.
    url: https://extension.harvard.edu/academics/programs/data-science-graduate-program/

  - id: harvard-sm-ds
    university: Harvard University (SEAS)
    program: SM in Data Science
    degree: SM, 3 semesters
    category: ai-masters
    opens: September 2026
    deadline: "2026-12-01"
    deadlineNote: Confirmed for Fall 2027 entry — December 1, 2026, 5pm ET. Single annual deadline.
    tuition: ~US$65k/yr
    tuitionSort: 65000
    fit: >
      Marginal — formally open to any bachelor's but expects real calculus,
      linear algebra, statistics and Python preparation.
    url: https://seas.harvard.edu/masters-data-science/how-apply

  - id: oxford-oii-sds
