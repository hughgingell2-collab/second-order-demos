name: OpportunityScout weekly scan

on:
  schedule:
    # Mondays 20:00 UTC = Tuesday 6–7am AEST
    - cron: "0 20 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: opportunity-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scout/requirements.txt

      - name: Install dependencies
        run: pip install -r scout/requirements.txt

      - name: Run scan
        run: python scout/scraper.py --delay 1.5

      - name: Commit updated state and dashboard data
        run: |
          git config user.name "opportunity-scout[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add scout/state.json opportunityscout/data.js
          if ! git diff --cached --quiet; then
            git commit -m "OpportunityScout: weekly scan $(date -u +%Y-%m-%d)"
            git push origin main
          else
            echo "No changes to commit."
          fi

      - name: Open notification issue if anything changed
        if: ${{ hashFiles('scout/report.md') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "OpportunityScout: changes detected $(date -u +%Y-%m-%d)" \
            --label "opportunity-scout" \
            --body-file scout/report.md \
          || gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "OpportunityScout: changes detected $(date -u +%Y-%m-%d)" \
            --body-file scout/report.md
